# PowerEngine package: the one-button update, the AppDaemon restarts and the watchdog.
#
# Install: copy into /config/packages/ (packages: !include_dir_named packages), check config, restart HA.
# Needed by every install. It names no other battery controller. If another one runs alongside PowerEngine and you
# want a handover switch, see the optional handover package in docs/INSTALL.md.
#
# A one-button update (latest app and card from HACS, then restart AppDaemon); restart AppDaemon when a new
# PowerEngine version is installed (or PowerEngine stops); and a watchdog that closes the inverter's windows if
# PowerEngine stops while it is in control. Everything is named "PowerEngine - ..." so it's easy to find.

script:
  # One button (Configuration page): install the latest PowerEngine app and card from HACS, then restart AppDaemon
  # so the new app (and its dashboard) is loaded. Finds HACS's update entities for PowerEngine by name.
  powerengine_update:
    alias: PowerEngine - Update to the latest release
    icon: mdi:update
    mode: single
    sequence:
      - variables:
          updates: >-
            {{ integration_entities('hacs') | select('match', 'update\\.') | select('search', 'powerengine')
               | list }}
          app: "{{ updates | reject('search', 'card') | first | default('') }}"
      - if:
          - condition: template
            value_template: "{{ updates | count == 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: powerengine_update
              title: PowerEngine update
              message: >-
                No HACS update entities for PowerEngine were found. In HACS, check both PowerEngine repositories are
                downloaded, and under Settings > Entities that their update entities are enabled.
          - stop: No PowerEngine update entities
      - action: homeassistant.update_entity         # ask HACS for the latest release now
        target:
          entity_id: "{{ updates }}"
        continue_on_error: true
      - delay: "00:00:05"
      - variables:
          pending: "{{ updates | select('is_state', 'on') | list }}"
      - if:
          - condition: template
            value_template: "{{ pending | count > 0 }}"
        then:
          - action: update.install
            target:
              entity_id: "{{ pending }}"
          - wait_template: "{{ pending | select('is_state', 'on') | list | count == 0 }}"
            timeout: "00:05:00"
            continue_on_timeout: true
          - delay: "00:00:20"                          # let HACS finish writing the files
      - variables:
          installed: "{{ state_attr(app, 'installed_version') | string | replace('v', '') if app else '' }}"
      - if:
          - condition: template
            value_template: "{{ installed != '' and installed != states('sensor.pe_diag_version') }}"
        then:
          - action: hassio.addon_restart
            data:
              addon: a0d7b954_appdaemon
          - wait_template: "{{ states('sensor.pe_diag_version') == installed }}"
            timeout: "00:03:00"
            continue_on_timeout: true
      - action: persistent_notification.create
        data:
          notification_id: powerengine_update
          title: PowerEngine update
          message: >-
            {%- if installed and states('sensor.pe_diag_version') == installed %}
            PowerEngine {{ installed }} is running.
            {%- elif installed %}
            PowerEngine {{ installed }} is installed but {{ states('sensor.pe_diag_version') }} is still running:
            check the AppDaemon log.
            {%- else %}
            Updates checked.
            {%- endif %}
            {% if pending | count == 0 %}Nothing new to install.{% else %}Installed the
            {% for e in pending %}{{ 'card' if 'card' in e else 'app' }}{{ ' and ' if not loop.last }}{% endfor %}.
            {%- endif %} Refresh the browser (or reopen the app) so the dashboard loads the matching card.

automation:
  # Watchdog: PowerEngine programs the inverter's timed windows ahead. If it stops (heartbeat stale or unavailable
  # for 15 minutes) while it is controlling the battery, close every window so the inverter falls back to Self-Use.
  - alias: PowerEngine - Watchdog
    id: powerengine_watchdog
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.pe_diag_heartbeat
        to: unavailable
        for: "00:15:00"
      - trigger: template
        value_template: >-
          {{ (now() - as_datetime(states('sensor.pe_diag_heartbeat'), now())).total_seconds() > 900 }}
    conditions:                    # only while PowerEngine is the controller (not Passive)
      - condition: template
        value_template: "{{ states('sensor.pe_state_operation_mode') in ['active', 'paused'] }}"
    actions:
      - repeat:
          for_each:
              - number.solis_timed_charge_start_hours
              - number.solis_timed_charge_start_minutes
              - number.solis_timed_charge_end_hours
              - number.solis_timed_charge_end_minutes
              - number.solis_timed_discharge_start_hours
              - number.solis_timed_discharge_start_minutes
              - number.solis_timed_discharge_end_hours
              - number.solis_timed_discharge_end_minutes
              - number.solis_timed_charge_start_hours_2
              - number.solis_timed_charge_start_minutes_2
              - number.solis_timed_charge_end_hours_2
              - number.solis_timed_charge_end_minutes_2
              - number.solis_timed_discharge_start_hours_2
              - number.solis_timed_discharge_start_minutes_2
              - number.solis_timed_discharge_end_hours_2
              - number.solis_timed_discharge_end_minutes_2
              - number.solis_timed_charge_start_hours_3
              - number.solis_timed_charge_start_minutes_3
              - number.solis_timed_charge_end_hours_3
              - number.solis_timed_charge_end_minutes_3
              - number.solis_timed_discharge_start_hours_3
              - number.solis_timed_discharge_start_minutes_3
              - number.solis_timed_discharge_end_hours_3
              - number.solis_timed_discharge_end_minutes_3
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states(repeat.item) | int(0) != 0 }}"
              then:
                - action: number.set_value
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    value: 0
      - action: button.press
        target:
          entity_id:
            - button.solis_update_charge_discharge_times
            - button.solis_update_charge_discharge_times_2
            - button.solis_update_charge_discharge_times_3
      - action: select.select_option
        target:
          entity_id: select.solis_energy_storage_control_switch
        data:
          option: Self-Use
      - action: persistent_notification.create
        data:
          title: PowerEngine watchdog
          message: >-
            PowerEngine stopped updating for 15 minutes, so the inverter's charge and discharge windows were closed
            (Self-Use). Check AppDaemon, then resume.

  # HACS replaces PowerEngine's files but AppDaemon keeps running the old code. PowerEngine notices the new version
  # on disk (within a minute) and fires pe_update_installed; restart AppDaemon so it loads it.
  - alias: PowerEngine - Restart AppDaemon after an update
    id: powerengine_restart_after_update
    mode: single
    triggers:
      - trigger: event
        event_type: pe_update_installed
    conditions:                    # the update button restarts AppDaemon itself
      - condition: state
        entity_id: script.powerengine_update
        state: "off"
    actions:
      - delay: "00:00:30"          # let HACS finish writing the files
      - action: hassio.addon_restart
        data:
          addon: a0d7b954_appdaemon
      - action: persistent_notification.create
        data:
          notification_id: powerengine_updated
          title: PowerEngine updated
          message: >-
            Version {{ trigger.event.data.installed }} installed (was {{ trigger.event.data.running }}); AppDaemon
            restarted to load it. Refresh the browser so the dashboard loads the matching card.

  # If PowerEngine stops updating (e.g. an update left AppDaemon unable to load it), restart AppDaemon once. At most
  # once an hour, so a real fault doesn't cause a restart loop; the watchdog above still closes the windows at 15 min.
  - alias: PowerEngine - Restart AppDaemon if PowerEngine stops
    id: powerengine_restart_if_stopped
    mode: single
    triggers:
      - trigger: template
        value_template: >-
          {{ (now() - as_datetime(states('sensor.pe_diag_heartbeat'), now())).total_seconds() > 420 }}
      - trigger: state
        entity_id: sensor.pe_diag_heartbeat
        to: unavailable
        for: "00:07:00"
    conditions:
      - condition: template
        value_template: >-
          {{ this.attributes.last_triggered is none
             or (now() - this.attributes.last_triggered).total_seconds() > 3600 }}
    actions:
      - action: hassio.addon_restart
        data:
          addon: a0d7b954_appdaemon
      - action: persistent_notification.create
        data:
          notification_id: powerengine_restarted
          title: PowerEngine stopped
          message: >-
            PowerEngine hadn't updated for 7 minutes, so AppDaemon was restarted. If this keeps happening, check the
            AppDaemon log.
