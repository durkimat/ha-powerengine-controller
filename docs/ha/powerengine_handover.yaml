# PowerEngine handover: one switch for which controller drives the battery, Predbat or PowerEngine.
#
# Install: copy into /config/packages/ (packages: !include_dir_named packages), check config, restart HA.
# Switch from the Battery controller panel on PowerEngine's Config tab (or by changing input_select.battery_controller).
# Either way the chosen controller ends up fully live; nothing else to do.
#
# To PowerEngine: legacy automations off, Predbat read-only on, PowerEngine un-paused and set to Active (saved in
#   its config), then waits up to 90 s for PowerEngine to report active and says whether it did.
# To Predbat: PowerEngine set to Passive (it closes its inverter windows: Self-Use) and un-paused, then Predbat
#   read-only off so Predbat takes over at its next update. PowerEngine goes first: if Predbat were released
#   first, PowerEngine's guard would trip and it would stop without tidying up its windows.
# For testing, pause PowerEngine (panel or Monitoring tab) while it's the controller: nobody drives the battery
# (Self-Use) and supervised tests are allowed. Un-pause to go live again.
# The legacy automations are no longer a choice: both handovers keep them off.

input_select:
  battery_controller:
    name: Battery controller
    icon: mdi:battery-sync
    options:
      - Predbat                    # first = what HA falls back to if the saved choice is no longer an option
      - PowerEngine

script:
  battery_handover_to_powerengine:
    alias: Battery - Hand control to PowerEngine (live)
    icon: mdi:battery-sync
    mode: single
    sequence:
      - action: automation.turn_off
        target:
          entity_id: &legacy
            - automation.charge_house_battery_on
            - automation.charge_house_battery_off
            - automation.discharge_house_battery_on
            - automation.discharge_house_battery_off
            - automation.house_battery_start_charging
            - automation.house_battery_stop_charging
            - automation.house_battery_start_charging_2
            - automation.house_battery_stop_charging_2
      - action: switch.turn_on
        target:
          entity_id: switch.predbat_set_read_only
      - delay: "00:00:10"          # let Predbat finish any write in progress
      - action: switch.turn_off
        target:
          entity_id: switch.pe_ctl_pause
      - event: pe_set_control
        event_data:
          operation: active
      - wait_template: "{{ is_state('sensor.pe_state_operation_mode', 'active') }}"
        timeout: "00:01:30"
        continue_on_timeout: true
      - action: persistent_notification.create
        data:
          notification_id: battery_handover
          title: >-
            {{ 'PowerEngine is live' if is_state('sensor.pe_state_operation_mode', 'active')
               else 'PowerEngine did NOT go live' }}
          message: >-
            Predbat is read-only and the legacy automations are off.
            PowerEngine: {{ states('sensor.pe_state_operation_mode') }} -
            {{ state_attr('sensor.pe_state_operation_mode', 'reason') }}
            {% if not is_state('sensor.pe_state_operation_mode', 'active') %}
            The inverter stays on Self-Use until this is fixed; switch back to Predbat if it can't be fixed now.
            {% endif %}

  battery_handover_to_predbat:
    alias: Battery - Hand control to Predbat (live)
    icon: mdi:battery-sync
    mode: single
    sequence:
      - event: pe_set_control
        event_data:
          operation: passive
      - wait_template: "{{ states('sensor.pe_state_operation_mode') not in ['active', 'paused'] }}"
        timeout: "00:01:00"
        continue_on_timeout: true
      - delay: "00:00:20"          # PowerEngine closes its windows, returns the inverter to Self-Use, reads it back
      - action: switch.turn_off
        target:
          entity_id: switch.pe_ctl_pause
      - action: automation.turn_off
        target:
          entity_id: *legacy
      - action: switch.turn_off
        target:
          entity_id: switch.predbat_set_read_only
      - action: persistent_notification.create
        data:
          notification_id: battery_handover
          title: Predbat is live
          message: >-
            PowerEngine is Passive (inverter windows closed, still planning and costing) and Predbat is out of
            read-only, so it takes over at its next update. The legacy automations stay off.

automation:
  - alias: Battery controller selector
    id: battery_controller_selector
    mode: queued
    triggers:
      - trigger: state
        entity_id: input_select.battery_controller
    conditions:
      # only real changes between the two options (not start-up, or the selector being created or re-optioned)
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none and trigger.to_state is not none
             and trigger.from_state.state in ['PowerEngine', 'Predbat']
             and trigger.to_state.state in ['PowerEngine', 'Predbat']
             and trigger.to_state.state != trigger.from_state.state }}
    actions:
      - if:
          - condition: template
            value_template: "{{ trigger.to_state.state == 'PowerEngine' }}"
        then:
          - action: script.battery_handover_to_powerengine
        else:
          - action: script.battery_handover_to_predbat

  # Watchdog: PowerEngine programs the inverter's timed windows ahead. If it stops (heartbeat stale or unavailable
  # for 15 minutes) while it's the battery controller, close every window so the inverter falls back to Self-Use.
  - alias: PowerEngine watchdog
    id: powerengine_watchdog
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.pe_diag_heartbeat
        to: unavailable
        for: "00:15:00"
      - trigger: template
        value_template: >-
          {{ (now() - as_datetime(states('sensor.pe_diag_heartbeat'), now())).total_seconds() > 900 }}
    conditions:
      - condition: state
        entity_id: input_select.battery_controller
        state: PowerEngine
    actions:
      - repeat:
          for_each:
              - number.solis_timed_charge_start_hours
              - number.solis_timed_charge_start_minutes
              - number.solis_timed_charge_end_hours
              - number.solis_timed_charge_end_minutes
              - number.solis_timed_discharge_start_hours
              - number.solis_timed_discharge_start_minutes
              - number.solis_timed_discharge_end_hours
              - number.solis_timed_discharge_end_minutes
              - number.solis_timed_charge_start_hours_2
              - number.solis_timed_charge_start_minutes_2
              - number.solis_timed_charge_end_hours_2
              - number.solis_timed_charge_end_minutes_2
              - number.solis_timed_discharge_start_hours_2
              - number.solis_timed_discharge_start_minutes_2
              - number.solis_timed_discharge_end_hours_2
              - number.solis_timed_discharge_end_minutes_2
              - number.solis_timed_charge_start_hours_3
              - number.solis_timed_charge_start_minutes_3
              - number.solis_timed_charge_end_hours_3
              - number.solis_timed_charge_end_minutes_3
              - number.solis_timed_discharge_start_hours_3
              - number.solis_timed_discharge_start_minutes_3
              - number.solis_timed_discharge_end_hours_3
              - number.solis_timed_discharge_end_minutes_3
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states(repeat.item) | int(0) != 0 }}"
              then:
                - action: number.set_value
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    value: 0
      - action: button.press
        target:
          entity_id:
            - button.solis_update_charge_discharge_times
            - button.solis_update_charge_discharge_times_2
            - button.solis_update_charge_discharge_times_3
      - action: select.select_option
        target:
          entity_id: select.solis_energy_storage_control_switch
        data:
          option: Self-Use
      - action: persistent_notification.create
        data:
          title: PowerEngine watchdog
          message: >-
            PowerEngine stopped updating for 15 minutes, so the inverter's charge and discharge windows were closed
            (Self-Use). Check AppDaemon, then resume.
