# Managed by PowerEngine: rewritten when PowerEngine updates. Edits here are replaced (a backup is kept).
# PowerEngine package: the one-button update and the watchdog.
#
# Install: nothing to copy. PowerEngine keeps this file in step itself, in your Home Assistant packages folder, and
# keeps a backup of anything it replaces. One-off: configuration.yaml needs `homeassistant: packages: !include_dir_named
# packages` and the packages folder must exist (see docs/INSTALL.md). After an update PowerEngine says when to press
# Load on its Config page so Home Assistant picks up a changed file.
# Needed by every install. It names no other battery controller.
#
# A one-button update (latest integration and card from HACS, then restart the engine); and a watchdog that closes
# the inverter's windows if PowerEngine stops while it is in control. Everything is named "PowerEngine - ..." so it's
# easy to find.

script:
  # One button (Configuration page): install the latest PowerEngine integration and card from HACS, then restart the
  # engine so the new version is running. Finds HACS's update entities for PowerEngine by name.
  powerengine_update:
    alias: PowerEngine - Update to the latest release
    icon: mdi:update
    mode: single
    sequence:
      - variables:
          updates: >-
            {{ integration_entities('hacs') | select('match', 'update\\.') | select('search', 'powerengine')
               | list }}
          app: "{{ updates | reject('search', 'card') | first | default('') }}"
      - if:
          - condition: template
            value_template: "{{ updates | count == 0 }}"
        then:
          - action: persistent_notification.create
            data:
              notification_id: powerengine_update
              title: PowerEngine update
              message: >-
                No HACS update entities for PowerEngine were found. In HACS, check both PowerEngine repositories are
                downloaded, and under Settings > Entities that their update entities are enabled.
          - stop: No PowerEngine update entities
      - action: homeassistant.update_entity         # ask HACS for the latest release now
        target:
          entity_id: "{{ updates }}"
        continue_on_error: true
      - delay: "00:00:05"
      - variables:
          pending: "{{ updates | select('is_state', 'on') | list }}"
      - if:
          - condition: template
            value_template: "{{ pending | count > 0 }}"
        then:
          - action: update.install
            target:
              entity_id: "{{ pending }}"
          - wait_template: "{{ pending | select('is_state', 'on') | list | count == 0 }}"
            timeout: "00:05:00"
            continue_on_timeout: true
          - delay: "00:00:20"                          # let HACS finish writing the files
      - variables:
          installed: "{{ state_attr(app, 'installed_version') | string | replace('v', '') if app else '' }}"
      - if:
          - condition: template
            value_template: "{{ installed != '' and installed != states('sensor.pe_diag_version') }}"
        then:
          - action: powerengine.restart_engine
          - wait_template: "{{ states('sensor.pe_diag_version') == installed }}"
            timeout: "00:03:00"
            continue_on_timeout: true
      - action: persistent_notification.create
        data:
          notification_id: powerengine_update
          title: PowerEngine update
          message: >-
            {%- if installed and states('sensor.pe_diag_version') == installed %}
            PowerEngine {{ installed }} is running.
            {%- elif installed %}
            PowerEngine {{ installed }} is installed but {{ states('sensor.pe_diag_version') }} is still running:
            check PowerEngine's log.
            {%- else %}
            Updates checked.
            {%- endif %}
            {% if pending | count == 0 %}Nothing new to install.{% else %}Installed the
            {% for e in pending %}{{ 'card' if 'card' in e else 'integration' }}{{ ' and ' if not loop.last }}{% endfor %}.
            {%- endif %} Refresh the browser (or reopen the app) so the dashboard loads the matching card.

automation:
  # Watchdog: PowerEngine programs the inverter's timed windows ahead. If it stops (heartbeat stale or unavailable
  # for 15 minutes) while it is controlling the battery, close every window so the inverter falls back to Self-Use.
  - alias: PowerEngine - Watchdog
    id: powerengine_watchdog
    mode: single
    triggers:
      - trigger: state
        entity_id: sensor.pe_diag_heartbeat
        to: unavailable
        for: "00:15:00"
      - trigger: template
        value_template: >-
          {{ (now() - as_datetime(states('sensor.pe_diag_heartbeat'), now())).total_seconds() > 900 }}
    conditions:                    # only while PowerEngine is the controller (not Passive)
      - condition: template
        value_template: "{{ states('sensor.pe_state_operation_mode') in ['active', 'paused'] }}"
    actions:
      - repeat:
          for_each:
              - number.solis_timed_charge_start_hours
              - number.solis_timed_charge_start_minutes
              - number.solis_timed_charge_end_hours
              - number.solis_timed_charge_end_minutes
              - number.solis_timed_discharge_start_hours
              - number.solis_timed_discharge_start_minutes
              - number.solis_timed_discharge_end_hours
              - number.solis_timed_discharge_end_minutes
              - number.solis_timed_charge_start_hours_2
              - number.solis_timed_charge_start_minutes_2
              - number.solis_timed_charge_end_hours_2
              - number.solis_timed_charge_end_minutes_2
              - number.solis_timed_discharge_start_hours_2
              - number.solis_timed_discharge_start_minutes_2
              - number.solis_timed_discharge_end_hours_2
              - number.solis_timed_discharge_end_minutes_2
              - number.solis_timed_charge_start_hours_3
              - number.solis_timed_charge_start_minutes_3
              - number.solis_timed_charge_end_hours_3
              - number.solis_timed_charge_end_minutes_3
              - number.solis_timed_discharge_start_hours_3
              - number.solis_timed_discharge_start_minutes_3
              - number.solis_timed_discharge_end_hours_3
              - number.solis_timed_discharge_end_minutes_3
          sequence:
            - if:
                - condition: template
                  value_template: "{{ states(repeat.item) | int(0) != 0 }}"
              then:
                - action: number.set_value
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    value: 0
      - action: button.press
        target:
          entity_id:
            - button.solis_update_charge_discharge_times
            - button.solis_update_charge_discharge_times_2
            - button.solis_update_charge_discharge_times_3
      - action: select.select_option
        target:
          entity_id: select.solis_energy_storage_control_switch
        data:
          option: Self-Use
      - action: persistent_notification.create
        data:
          title: PowerEngine watchdog
          message: >-
            PowerEngine stopped updating for 15 minutes, so the inverter's charge and discharge windows were closed
            (Self-Use). Check PowerEngine's Engine sensor and Repairs, then resume.
