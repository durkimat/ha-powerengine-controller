name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "CLAUDE.md"
      - "release-notes/**"
      - "docs/plans/**"
      - "docs/history/**"
      - "docs/RELEASING.md"
  pull_request:
    paths-ignore:
      - "CLAUDE.md"
      - "release-notes/**"
      - "docs/plans/**"
      - "docs/history/**"
      - "docs/RELEASING.md"

# A newer push to the same PR cancels the run it replaces; main's runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q -n auto --dist loadscope

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: appdaemon
          ignore: brands description topics
