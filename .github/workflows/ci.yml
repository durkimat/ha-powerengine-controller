name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same PR cancels the run it replaces; main's runs always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # main requires this job's check, so it always runs; a change that only touches notes and plans skips the slow steps.
      - name: Does the change touch code?
        id: changes
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: tools/ci_changes.sh "$BASE" HEAD >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.changes.outputs.code == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - if: steps.changes.outputs.code == 'true'
        run: pip install -r requirements-dev.txt
      - if: steps.changes.outputs.code == 'true'
        run: ruff check .
      - if: steps.changes.outputs.code == 'true'
        run: pytest -q -n auto --dist loadscope

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: appdaemon
          ignore: brands description topics
